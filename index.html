<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora TI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>.tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }</style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <div id="login-container" class="flex flex-col items-center justify-center h-screen bg-gray-900 text-white">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl text-center max-w-md w-full">
            <h1 class="text-2xl font-bold mb-2">Bitácora TI</h1>
            <p class="text-gray-400 mb-6 text-sm">Sistema de Gestión</p>
            <div id="g_id_onload" data-client_id="1063772408490-0fipirlhukj70uvol4k2pjvehp753c5t.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
        </div>
    </div>
    <div id="app-container" class="hidden flex flex-col min-h-screen">
        <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">Bitácora TI</h1>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm text-gray-600 font-medium"></span>
                <button onclick="cerrarSesion()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded text-sm transition">Salir</button>
            </div>
        </header>
        <nav class="bg-white border-b px-6 flex gap-6">
            <button onclick="cambiarSeccion('Prestamos')" id="btn-Prestamos" class="py-3 tab-active transition">Préstamos</button>
            <button onclick="cambiarSeccion('Soporte')" id="btn-Soporte" class="py-3 text-gray-500 hover:text-blue-600 transition">Soporte</button>
            <button onclick="cambiarSeccion('Uso_Sala')" id="btn-Uso_Sala" class="py-3 text-gray-500 hover:text-blue-600 transition">Uso de Sala</button>
            <button onclick="cambiarSeccion('Permanente')" id="btn-Permanente" class="py-3 text-gray-500 hover:text-blue-600 transition">Permanente</button>
        </nav>
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            <div id="panel-pendientes" class="mb-6 grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r shadow-sm">
                    <h3 class="font-bold text-amber-800 text-sm mb-1">Préstamos Pendientes</h3>
                    <p id="count-prestamos-pendientes" class="text-2xl font-semibold text-amber-900">0</p>
                </div>
                <div class="bg-rose-50 border-l-4 border-rose-500 p-4 rounded-r shadow-sm">
                    <h3 class="font-bold text-rose-800 text-sm mb-1">Tickets de Soporte Abiertos</h3>
                    <p id="count-soporte-pendientes" class="text-2xl font-semibold text-rose-900">0</p>
                </div>
            </div>
            <div class="flex justify-between items-center mb-6">
                <h2 id="titulo-seccion" class="text-2xl font-semibold text-gray-700">Préstamos</h2>
                <button onclick="abrirModalNuevo()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition">+ Nuevo Registro</button>
            </div>
            <div class="bg-white rounded-xl shadow overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead id="tabla-head" class="bg-gray-50 border-b text-gray-600 text-sm"></thead>
                    <tbody id="tabla-body" class="divide-y divide-gray-200 text-sm"></tbody>
                </table>
            </div>
        </main>
    </div>
    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 id="modal-titulo" class="text-lg font-bold mb-4">Nuevo Registro</h3>
            <form id="modal-form" onsubmit="guardarRegistro(event)" class="space-y-4"></form>
        </div>
    </div>
    <div id="toast" class="fixed bottom-5 right-5 hidden bg-gray-900 text-white px-4 py-2 rounded-lg shadow-xl text-sm z-50 transition"></div>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwy4FnaLC_1bTDLZ73JjDye17a69hJDLN7FwCuHAK3vsdIqXDMqjHSBGNjmJOWQpMClig/exec"; 
        let googleToken = null; 
        let seccionActual = "Prestamos";
        let globalDataCache = null;

        const CAMPOS_SECCION = {
            Prestamos: [
                { name: "fecha", label: "Fecha", type: "date" },
                { name: "profesor_sala", label: "Profesor/a - Sala", type: "text" },
                { name: "insumo_equipo", label: "Insumo / Equipo", type: "text" },
                { name: "cantidad", label: "Cantidad", type: "text" },
                { name: "hora_entrega", label: "Hora Entrega", type: "time" },
                { name: "hora_devolucion", label: "Hora Devolucion", type: "time", required: false },
                { name: "estado_logistico", label: "Estado Logistico", type: "select", options: ["Pendiente", "Devuelto", "Bueno", "Dañado", "En Tránsito"] },
                { name: "estado_fisico", label: "Estado Fisico", type: "text" },
                { name: "observaciones", label: "Observaciones", type: "text", required: false }
            ],
            Soporte: [
                { name: "fecha_hora", label: "Fecha y Hora", type: "datetime-local" },
                { name: "ubicacion", label: "Ubicacion", type: "text" },
                { name: "equipo", label: "Equipo", type: "text" },
                { name: "tipo_mantenimiento", label: "Tipo de Mantenimiento", type: "text" },
                { name: "descripcion", label: "Descripcion de la Tarea", type: "text" },
                { name: "estado_final", label: "Estado Final", type: "select", options: ["Abierto", "En Proceso", "Solucionado", "Derivado a Terceros"] },
                { name: "observaciones", label: "Observaciones", type: "text", required: false }
            ],
            Uso_Sala: [
                { name: "fecha", label: "Fecha", type: "date" },
                { name: "hora", label: "Hora", type: "time" },
                { name: "curso_usuario", label: "Curso o Usuario", type: "text" },
                { name: "profesor_responsable", label: "Profesor Responsable", type: "text" },
                { name: "asignatura", label: "Asignatura", type: "text" },
                { name: "actividad", label: "Actividad Realizada", type: "text" },
                { name: "observaciones", label: "Observaciones", type: "text", required: false }
            ],
            Permanente: [
                { name: "fecha_registro", label: "Fecha Registro", type: "date" },
                { name: "profesor_sala", label: "Profesor/a - Sala", type: "text" },
                { name: "insumo_equipo", label: "Insumo / Equipo", type: "text" },
                { name: "cantidad", label: "Cantidad", type: "text" },
                { name: "estado", label: "Estado", type: "select", options: ["Operativo", "En Reparación", "Dado de Baja"] },
                { name: "observaciones", label: "Observaciones", type: "text", required: false }
            ]
        };

        const JSON_KEY_MAP = { Prestamos: "prestamos", Soporte: "soporte", Uso_Sala: "sala", Permanente: "permanente" };
        const ESTADO_INDICES = { Prestamos: 6, Soporte: 5 };

        window.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('googleToken');
            const savedTime = localStorage.getItem('tokenTimestamp');
            if (savedToken && savedTime && (Date.now() - savedTime < 24 * 60 * 60 * 1000)) {
                googleToken = savedToken;
                try {
                    const base64Url = googleToken.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const payload = JSON.parse(atob(base64));
                    document.getElementById('user-email').innerText = payload.email;
                    document.getElementById('login-container').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    cargarDatosServidor();
                } catch (e) { cerrarSesion(); }
            }
        });

        function handleCredentialResponse(response) {
            googleToken = response.credential;
            localStorage.setItem('googleToken', googleToken);
            localStorage.setItem('tokenTimestamp', Date.now());
            try {
                const base64Url = googleToken.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(atob(base64));
                document.getElementById('user-email').innerText = payload.email;
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                cargarDatosServidor();
            } catch (e) { cerrarSesion(); }
        }

        function cerrarSesion() {
            localStorage.removeItem('googleToken');
            localStorage.removeItem('tokenTimestamp');
            googleToken = null;
            location.reload();
        }

        function cambiarSeccion(seccion) {
            seccionActual = seccion;
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('tab-active', 'text-gray-500'));
            document.getElementById('btn-' + seccion).classList.add('tab-active');
            document.getElementById('titulo-seccion').innerText = seccion.replace('_', ' ');
            renderizarTabla();
        }

        async function cargarDatosServidor() {
            if (!googleToken) return cerrarSesion();
            mostrarToast("Cargando...", "info");
            try {
                let res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ token: googleToken, action: "get_data" }) });
                let result = await res.json();
                if(result.status !== 'success') { 
                    if(result.message === "No autorizado") { cerrarSesion(); return; } 
                    throw new Error(result.message); 
                }
                globalDataCache = result.data;
                if(globalDataCache.pendientes) {
                    document.getElementById('panel-pendientes').classList.remove('hidden');
                    document.getElementById('count-prestamos-pendientes').innerText = globalDataCache.pendientes.prestamos?.length || 0;
                    document.getElementById('count-soporte-pendientes').innerText = globalDataCache.pendientes.soporte?.length || 0;
                }
                renderizarTabla(); 
                ocultarToast();
            } catch (err) { mostrarToast('Error: ' + err.message, 'error'); }
        }

        function escaparHTML(str) { return String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

        function renderizarTabla() {
            if (!globalDataCache || !globalDataCache.historial) return;
            const head = document.getElementById('tabla-head'), body = document.getElementById('tabla-body');
            let campos = CAMPOS_SECCION[seccionActual], jsonKey = JSON_KEY_MAP[seccionActual];
            head.innerHTML = `<tr class="bg-gray-50"><th class="p-3 w-24">Acciones</th>` + campos.map(c => `<th class="p-3">${c.label}</th>`).join('') + `</tr>`;
            let filas = globalDataCache.historial[jsonKey] || [];
            body.innerHTML = '';
            if (filas.length === 0) { body.innerHTML = `<tr><td colspan="${campos.length + 1}" class="p-4 text-center text-gray-400">Sin registros</td></tr>`; return; }
            filas.forEach(r => {
                let id = r[0], valoresRestantes = r.slice(1), tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-3"><button onclick="abrirModalEditar('${id}')" class="text-blue-600 hover:text-blue-800 font-medium">Editar</button></td>` + 
                valoresRestantes.map((v, idx) => {
                    if ((seccionActual === 'Prestamos' || seccionActual === 'Soporte') && idx === ESTADO_INDICES[seccionActual]) {
                        let opts = campos[idx].options.map(o => `<option value="${o}" ${v === o ? 'selected' : ''}>${o}</option>`).join('');
                        return `<td class="p-3"><select onchange="cambiarEstadoRapido('${id}', this.value)" class="border rounded px-2 py-1 text-xs bg-white font-medium shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">${opts}</select></td>`;
                    }
                    return `<td class="p-3">${escaparHTML(v)}</td>`;
                }).join('');
                body.appendChild(tr);
            });
        }

        async function cambiarEstadoRapido(id, nuevoEstado) {
            mostrarToast("Actualizando...", "info");
            try {
                let res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ token: googleToken, seccion: seccionActual, action: "update_status", id, nuevoEstado }) });
                let result = await res.json();
                if(result.status !== 'success') throw new Error(result.message);
                cargarDatosServidor();
            } catch (err) { mostrarToast("Error: " + err.message, "error"); cargarDatosServidor(); }
        }

        function abrirModalNuevo() { 
            document.getElementById('modal-titulo').innerText = "Nuevo - " + seccionActual.replace('_', ' '); 
            construirFormularioModal(); 
            document.getElementById('modal').classList.remove('hidden'); 
        }

        function abrirModalEditar(id) {
            let registro = globalDataCache.historial[JSON_KEY_MAP[seccionActual]].find(r => r[0] === id);
            if (!registro) return;
            document.getElementById('modal-titulo').innerText = "Editar Registro";
            construirFormularioModal(id, registro.slice(1));
            document.getElementById('modal').classList.remove('hidden');
        }

        function construirFormularioModal(editId = null, valores = []) {
            let form = document.getElementById('modal-form');
            let campos = CAMPOS_SECCION[seccionActual];
            
            const hoyYMD = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Santiago' });
            const horaHM = new Date().toLocaleTimeString('en-GB', { timeZone: 'America/Santiago', hour: '2-digit', minute: '2-digit' });
            const ahoraDT = `${hoyYMD}T${horaHM}`;

            form.innerHTML = (editId ? `<input type="hidden" id="edit-id" value="${editId}">` : '') + 
            campos.map((c, i) => {
                let val = valores[i];

                // Si es un NUEVO registro y es la hora de devolución, se oculta y envía vacía
                if (!editId && seccionActual === 'Prestamos' && c.name === 'hora_devolucion') {
                    return `<input type="hidden" name="campo_${i}" value="">`;
                }

                if (val === undefined || val === '') {
                    if (!editId) {
                        if (c.type === 'date') val = hoyYMD;
                        if (c.type === 'time' && c.name !== 'hora_devolucion') val = horaHM;
                        if (c.type === 'datetime-local') val = ahoraDT;
                    }
                }
                val = val || '';
                let req = c.required !== false ? 'required' : '';
                return `<div><label class="block text-xs font-bold uppercase text-gray-600 mb-1">${c.label}</label>${c.type === 'select' ? `<select name="campo_${i}" ${req} class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">${c.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>` : `<input type="${c.type}" name="campo_${i}" value="${escaparHTML(val)}" ${req} class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">`}</div>`;
            }).join('') + `<div class="flex justify-end gap-2 mt-4 pt-2 border-t"><button type="button" onclick="cerrarModal()" class="bg-gray-200 px-4 py-2 rounded text-sm">Cancelar</button><button type="submit" id="btn-guardar" class="bg-blue-600 text-white px-4 py-2 rounded text-sm">Guardar</button></div>`;
            document.getElementById('modal').classList.remove('hidden');
        }

        function cerrarModal() { document.getElementById('modal').classList.add('hidden'); }

        async function guardarRegistro(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-guardar');
            btn.disabled = true; btn.innerText = "Guardando...";
            let payload = { 
                token: googleToken, 
                seccion: seccionActual, 
                action: document.getElementById('edit-id') ? "edit_row" : "insert", 
                rowValues: CAMPOS_SECCION[seccionActual].map((_, i) => event.target.elements[`campo_${i}`].value) 
            };
            if (payload.action === "edit_row") payload.id = document.getElementById('edit-id').value;
            try {
                let res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                let result = await res.json();
                if(result.status !== 'success') throw new Error(result.message);
                cerrarModal(); mostrarToast("Guardado!", "success"); cargarDatosServidor();
            } catch (err) { mostrarToast("Error: " + err.message, "error"); btn.disabled = false; btn.innerText = "Guardar"; }
        }

        function mostrarToast(m, t) { 
            let toast = document.getElementById('toast'); 
            toast.innerText = m; 
            toast.className = `fixed bottom-5 right-5 text-white px-4 py-2 rounded-lg shadow-xl text-sm z-50 transition ${t === 'error' ? 'bg-red-600' : 'bg-green-600'}`; 
            toast.classList.remove('hidden'); 
            setTimeout(() => toast.classList.add('hidden'), 4000); 
        }

        function ocultarToast() { document.getElementById('toast').classList.add('hidden'); }
    </script>
</body>
</html>
