<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitacora TI | Gestion Escolar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- (El CSS y otros elementos permanecen iguales para ahorrar espacio en esta respuesta) -->
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">
    
    <!-- (Mantener el cuerpo igual que en la versión anterior) -->
    
    <script>
        // URL ACTUALIZADA
        const API_URL = "https://script.google.com/macros/s/AKfycbxvI3YQhvX7RG-U_PLARqdfUQnUfCJrD0guDiRcSiafqTcJOtIYJvT40WR6mRpu-Z2GNg/exec"; 
        
        let googleToken = null; 
        let customUser = null;
        let seccionActual = "Prestamos";
        let globalDataCache = null;
        let globalPapeleraCache = null;

        // ... (El resto del código JavaScript se mantiene igual)
        
        async function cargarDatosServidor() {
            if (!googleToken && !customUser) return cerrarSesion();
            mostrarToast("Cargando base de datos...", "info");
            let targetMonth = document.getElementById('month-selector').value;
            try {
                // Si esto sigue fallando con 302, el problema es que el código .gs está fallando antes de responder
                let res = await fetch(API_URL, { 
                    method: "POST", 
                    mode: "cors", // Importante
                    body: JSON.stringify({ token: googleToken, customUser, action: "get_data", targetMonth }) 
                });
                
                let result = await res.json();
                if(result.status !== 'success') { 
                    if(result.message === "No autorizado") return cerrarSesion();
                    throw new Error(result.message); 
                }
                globalDataCache = result.data;
                renderizarTabla(); 
                ocultarToast();
            } catch (err) { 
                console.error(err);
                mostrarToast('Error de conexion: ' + err.message, 'error'); 
            }
        }
        
        // ... resto de las funciones ...
    </script>
</body>
</html>
